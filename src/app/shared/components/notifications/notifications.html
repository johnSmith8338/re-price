<div class="notifications-container" aria-live="polite">
    @for (notification of notificationSvc.notifications(); track notification.id) {
        <article class="notification"
            [class.success]="notification.type==='success'"
            [class.error]="notification.type==='error'"
            [class.warning]="notification.type==='warning'"
            [class.info]="notification.type==='info'"
            [attr.role]="notification.type==='error' ? 'alert' : 'status'"
        >
            <span>{{notification.message}}</span>

            <button type="button"
                aria-label="Закрыть уведомление"
                (click)="notificationSvc.dismiss(notification.id)"
            >
                Закрыть
            </button>
        </article>
    }
</div>
