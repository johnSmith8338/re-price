@if (visible()) {
    <div class="backdrop" (click)="closed.emit()">
        <section #dialog class="bottom-sheet" role="dialog"
            aria-modal="true"
            tabindex="-1"
            [attr.aria-label]="title()"
            [style.transform]="`translateY(${dragOffset()}px)`"
            (click)="$event.stopPropagation()"
            (keydown)="onDialogKeydown($event)"
        >
            <div class="bottom-sheet-drag-area">
                <div class="bottom-sheet-handle"
                    (pointerdown)="onDragStart($event)"
                    (pointermove)="onDragMove($event)"
                    (pointerup)="onDragEnd($event)"
                    (pointercancel)="onDragCancel($event)"
                ></div>

                <header class="bottom-sheet-header">
                    <h2>{{title()}}</h2>
    
                    <div class="bottom-sheet-header-actions">
                        <button type="button"
                            [disabled]="closeDisabled()"
                            (click)="closed.emit()">
                            {{closeLabel()}}
                        </button>
                        <button type="button"
                            [disabled]="applyDisabled()"
                            (click)="applied.emit()">
                            {{applyLabel()}}
                        </button>
                    </div>
                </header>
            </div>

            <div class="bottom-sheet-content">
                <ng-content />
            </div>
        </section>
    </div>
}
